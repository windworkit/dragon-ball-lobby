name: Build Dragon Ball Lobby Datapack

on:
  push:
    paths:
      - "datapack/**"
      - "tools/**"
      - ".github/workflows/build-datapack.yml"
  pull_request:
    paths:
      - "datapack/**"
      - "tools/**"
      - ".github/workflows/build-datapack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate datapack
        run: python tools/validate_pack.py
      - name: Package datapack
        run: |
          cd datapack
          zip -r ../DragonBallLobby-Datapack-1.0.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: DragonBallLobby-Datapack-1.0
          path: DragonBallLobby-Datapack-1.0.zip
          if-no-files-found: error
