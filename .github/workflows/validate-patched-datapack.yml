name: Validate repaired Dragon Ball lobby

on:
  push:
    paths:
      - "versions/patched/**"
      - ".github/workflows/validate-patched-datapack.yml"
  pull_request:
    paths:
      - "versions/patched/**"
      - ".github/workflows/validate-patched-datapack.yml"
  workflow_dispatch:

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Validate patched datapack
        run: python versions/patched/tools/validate_pack.py
